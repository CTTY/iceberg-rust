# cbindgen configuration for iceberg-ffi.
#
# The header is plain C by construction: every type that crosses the boundary
# is a #[repr(C)] struct or enum with explicit discriminants, and result types
# are written out per payload type instead of being generic, so nothing in the
# output needs templates or C++-only features. cpp_compat adds the extern "C"
# guards so the same header is included from the C++ extension.

language = "C"
cpp_compat = true
pragma_once = true
include_version = false
documentation = true
documentation_style = "c99"
header = "/* iceberg-ffi: C ABI over apache/iceberg-rust for the iceberg_rs DuckDB extension. */"
autogen_warning = "/* Generated by cbindgen from iceberg-ffi/src; do not edit by hand. */"
sys_includes = ["stdarg.h", "stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true

[export]
# cbindgen only emits types reachable from an exported function. The file
# system vtable is filled in by the engine and handed to Rust, so list it (and
# the types it is built from) explicitly.
include = [
  "IcebergIoStatus",
  "IcebergFsOpenFn",
  "IcebergFsFileSizeFn",
  "IcebergFsReadAtFn",
  "IcebergFsCloseFn",
  "IcebergFsExistsFn",
  "IcebergFsErrorMessageFn",
  "IcebergFsReleaseFn",
  "IcebergFileSystemVTable",
]

[export.rename]
# Types whose Rust names are generic words get an Iceberg prefix in C, since
# the header is included at global scope by the engine.
"EngineError" = "IcebergEngineError"
"Runtime" = "IcebergRuntime"
"Table" = "IcebergTable"
# Handle instantiations (Shared<T> / Exclusive<T>) are named <Kind><T> by
# cbindgen; list each one here.
"SharedRuntime" = "IcebergSharedRuntime"
"SharedTable" = "IcebergSharedTable"
"StringSlice" = "IcebergStringSlice"
"AllocateErrorFn" = "IcebergAllocateErrorFn"
"AllocateStringFn" = "IcebergAllocateStringFn"
"LogCallbackFn" = "IcebergLogCallbackFn"

[export.mangle]
remove_underscores = true

[enum]
# Variants are emitted as <EnumName>_<Variant>, e.g. IcebergLogLevel_Debug, so
# no bare identifier such as DEBUG can collide with host macros.
prefix_with_name = true

[fn]
sort_by = "None"

[struct]
derive_eq = false

[parse]
parse_deps = false
