# cbindgen configuration for iceberg-ffi.
#
# The header is plain C by construction: every type that crosses the boundary
# is a #[repr(C)] struct or enum with explicit discriminants, and result types
# are written out per payload type instead of being generic, so nothing in the
# output needs templates or C++-only features. cpp_compat adds the extern "C"
# guards so the same header is included from the C++ extension.

autogen_warning = "/* Generated by cbindgen from bindings/c/src; do not edit by hand. */"
cpp_compat = true
documentation = true
documentation_style = "c99"
header = """/*
 * Licensed to the Apache Software Foundation (ASF) under one
 * or more contributor license agreements.  See the NOTICE file
 * distributed with this work for additional information
 * regarding copyright ownership.  The ASF licenses this file
 * to you under the Apache License, Version 2.0 (the
 * "License"); you may not use this file except in compliance
 * with the License.  You may obtain a copy of the License at
 *
 *   http://www.apache.org/licenses/LICENSE-2.0
 *
 * Unless required by applicable law or agreed to in writing,
 * software distributed under the License is distributed on an
 * "AS IS" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY
 * KIND, either express or implied.  See the License for the
 * specific language governing permissions and limitations
 * under the License.
 */

/* iceberg-ffi: C ABI over apache/iceberg-rust for query engines. */"""
include_version = false
language = "C"
no_includes = true
pragma_once = true
sys_includes = ["stdarg.h", "stdbool.h", "stddef.h", "stdint.h"]
usize_is_size_t = true
# cbindgen cannot evaluate `usize::MAX`, so the predicate builder's sentinel
# (`predicate::ICEBERG_PRED_NONE`) is spelled out here; a unit test in
# predicate.rs pins the Rust value to `usize::MAX` == SIZE_MAX.
after_includes = """

/* Node id returned by a failing `iceberg_pred_*` constructor, and returned by
 * the engine's predicate visitor to mean "no predicate". */
#define ICEBERG_PRED_NONE SIZE_MAX"""

[export]
# cbindgen only emits types reachable from an exported function. The file
# system vtable is filled in by the engine and handed to Rust, so list it (and
# the types it is built from) explicitly.
include = [
  "IcebergIoStatus",
  "IcebergFsOpenFn",
  "IcebergFsFileSizeFn",
  "IcebergFsReadAtFn",
  "IcebergFsCloseFn",
  "IcebergFsExistsFn",
  "IcebergFsErrorMessageFn",
  "IcebergFsReleaseFn",
  "IcebergFileSystemVTable",
]

[export.rename]
# Types whose Rust names are generic words get an Iceberg prefix in C, since
# the header is included at global scope by the engine.
"EngineError" = "IcebergEngineError"
"Runtime" = "IcebergRuntime"
"Table" = "IcebergTable"
# Handle instantiations (Shared<T> / Exclusive<T>) are named <Kind><T> by
# cbindgen; list each one here.
"AllocateErrorFn" = "IcebergAllocateErrorFn"
"AllocateStringFn" = "IcebergAllocateStringFn"
"ExclusiveScanBuilder" = "IcebergExclusiveScanBuilder"
"FileTask" = "IcebergFileTask"
"LogCallbackFn" = "IcebergLogCallbackFn"
"Scan" = "IcebergScan"
"ScanBuilder" = "IcebergScanBuilder"
"SharedFileTask" = "IcebergSharedFileTask"
"SharedRuntime" = "IcebergSharedRuntime"
"SharedScan" = "IcebergSharedScan"
"SharedTable" = "IcebergSharedTable"
"StringSlice" = "IcebergStringSlice"

[export.mangle]
remove_underscores = true

[enum]
# Variants are emitted as <EnumName>_<Variant>, e.g. IcebergLogLevel_Debug, so
# no bare identifier such as DEBUG can collide with host macros.
prefix_with_name = true

[fn]
sort_by = "None"

[struct]
derive_eq = false

[parse]
parse_deps = false
