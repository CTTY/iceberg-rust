[package]
edition = { workspace = true }
homepage = { workspace = true }
name = "iceberg-ffi"
# This crate is a static library consumed by C and C++ engines, not a Rust
# dependency; it is not published to crates.io.
publish = false
rust-version = { workspace = true }
version = { workspace = true }

categories = ["database"]
description = "C ABI over Apache Iceberg Rust for embedding in query engines"
keywords = ["iceberg", "ffi", "c", "bindings"]
license = { workspace = true }
repository = { workspace = true }

[lib]
crate-type = ["staticlib"]

[dependencies]
bytes = { workspace = true }
iceberg = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Required to implement iceberg's `Storage`, `StorageFactory` and `FileRead`
# traits: their definitions carry #[async_trait] and #[typetag::serde] (which
# needs serde Serialize/Deserialize on the implementing type) and
# `delete_stream` takes a `futures::stream::BoxStream`.
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
typetag = { workspace = true }
# `Datum::uuid` takes a `uuid::Uuid` and iceberg does not re-export the crate.
uuid = { workspace = true }

[build-dependencies]
cbindgen = { workspace = true }

[package.metadata.cargo-machete]
# Used only inside `#[async_trait]` / `#[typetag::serde]` expansions.
ignored = ["async-trait", "serde", "typetag"]

[lints]
workspace = true
